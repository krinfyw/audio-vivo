<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonido Vivo - Iniciar Sesión</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="style/login.css">
  <link rel="stylesheet" href="style/style.css">
  <script src="js/auth.js" defer></script>

</head>

<body class="pagina-login">

  <header>
    <div class="header-contenido">
      <div class="marca">
        <h1 class="marca-titulo">Sonido Vivo</h1>
        <p class="marca-lema">Instrumentos y Equipos Musicales • Viña del Mar</p>
      </div>
      <div class="menu-derecha">
        <nav>
          <ul>
            <li>
              <a href="index.html" id="btn-auth">Volver al inicio</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <main class="login-pantalla">
    <div class="login-tarjeta">

      <div class="titulo-login">
        <h2>Iniciar Sesión</h2>
      </div>

      <form id="form-login" novalidate>
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.cl" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 12 caracteres" minlength="12" required>

        <button type="submit" class="btn-login">Ingresar</button>
        <p id="mensaje-login" class="mensaje-login"></p>
      </form>

    </div>
  </main>

  <footer class="footer">
    <p class="footer-texto">Contacto: atencionalsonido@sonidovivo.cl | Teléfono: +56 9 1234 5678</p>
    <p class="footer-texto">© 2026 Sonido Vivo - Viña del Mar. Todos los derechos reservados.</p>
  </footer>

</body>

</html>
